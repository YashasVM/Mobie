    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var $ = function (id) { return document.getElementById(id); };

        /* ---------- setup ---------- */
        var arc = $("h01-arc");
        var ARC_LEN = arc.getTotalLength();
        var maskPath = $("h01-maskpath");
        maskPath.style.strokeDasharray = ARC_LEN + "";
        maskPath.style.strokeDashoffset = ARC_LEN + "";
        var cloudPath = $("h01-cloudpath");
        var CLOUD_LEN = cloudPath.getTotalLength();
        cloudPath.style.strokeDasharray = CLOUD_LEN + "";
        cloudPath.style.strokeDashoffset = CLOUD_LEN + "";

        var bubble = $("h01-bubble");
        var ghosts = [$("h01-g1"), $("h01-g2"), $("h01-g3")];
        var packets = Array.prototype.slice.call(document.querySelectorAll(".h01-packet"));
        var leds = Array.prototype.slice.call(document.querySelectorAll(".h01-led"));
        var racks = Array.prototype.slice.call(document.querySelectorAll(".h01-rack"));

        gsap.set(bubble, { x: 620, y: 560, scale: 1 });
        gsap.set(ghosts, { x: 620, y: 560, opacity: 0 });
        gsap.set(leds, { opacity: 0.15 });
        gsap.set(packets, { opacity: 0 });

        /* kicker text, typed */
        var kicker = $("h01-kicker");
        var KTXT = "> sending prompt…";
        var kch = [];
        for (var i = 0; i < KTXT.length; i++) {
          var s = document.createElement("span");
          s.className = "h01-kch";
          s.textContent = KTXT.charAt(i);
          kicker.appendChild(s);
          kch.push(s);
        }
        var cur = document.createElement("span");
        cur.className = "h01-cursor";
        cur.id = "h01-cursor";
        kicker.appendChild(cur);

        /* ---------- Scene 1 (0 - 1.9): quiet setup, bubble pops ---------- */
        tl.fromTo("#h01-phone", { opacity: 0, y: 40, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 0.0);
        tl.fromTo("#h01-bubble-in", { scale: 0, opacity: 0, y: 70 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 0.08);
        tl.fromTo("#h01-phone-screen", { opacity: 0.4 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2);
        tl.set(cur, { opacity: 1 }, 0.2);
        kch.forEach(function (c, idx) { tl.set(c, { opacity: 1 }, 0.2 + idx * 0.045); });
        /* cursor blink (deterministic sets) */
        for (var b = 0; b < 8; b++) { tl.set(cur, { opacity: b % 2 ? 1 : 0 }, 1.0 + b * 0.18); }
        tl.set(cur, { opacity: 1 }, 2.44);
        /* waiting tension: bubble breathes, phone glows */
        tl.to("#h01-bubble-in", { scale: 1.03, duration: 0.7, ease: "sine.inOut" }, 0.7);
        tl.to("#h01-bubble-in", { scale: 1.0, duration: 0.5, ease: "sine.inOut" }, 1.4);
        tl.to("#h01-phone-screen", { opacity: 0.55, duration: 0.45, ease: "sine.inOut" }, 1.0);
        tl.to("#h01-phone-screen", { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 1.45);

        /* ---------- cloud arrives (1.35 - 2.15) ---------- */
        tl.fromTo("#h01-blob-mag", { opacity: 0.12 }, { opacity: 0.32, duration: 0.8, ease: "power2.out" }, 1.35);
        tl.to(cloudPath, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 1.35);
        tl.to(cloudPath, { fillOpacity: 1, duration: 0.4, ease: "power1.out" }, 1.95);
        racks.forEach(function (r, idx) {
          tl.fromTo(r, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 1.75 + idx * 0.08);
        });
        /* servers blink (deterministic pattern) */
        for (var k = 0; k < 10; k++) {
          var row = (k * 3 + 1) % 4;
          var at = 1.85 + k * 0.1;
          tl.set(leds[row], { opacity: 1 }, at);
          tl.set(leds[row], { opacity: 0.15 }, at + 0.09);
        }

        /* ---------- anticipation (1.95 - 2.18) ---------- */
        tl.to("#h01-bubble-in", { scale: 0.93, duration: 0.23, ease: "power2.inOut" }, 1.95);
        tl.to("#h01-phone-screen", { opacity: 1, duration: 0.08, ease: "power2.out" }, 2.1);

        /* ---------- Scene 2: launch (2.18 -> 3.0) ---------- */
        var FLY_AT = 2.18, FLY_DUR = 0.82;
        var fly = { p: 0 };
        var LAG = [0.05, 0.1, 0.15];
        function pt(p) { return arc.getPointAtLength(Math.max(0, Math.min(1, p)) * ARC_LEN); }
        function apply() {
          var p = fly.p;
          var q = pt(p);
          var sc = 1 - 0.72 * p;
          gsap.set(bubble, { x: q.x, y: q.y, scale: sc, rotation: -10 * Math.sin(Math.PI * p) });
          var vel = (1 - p);
          ghosts.forEach(function (g, gi) {
            var gp = Math.max(0, p - LAG[gi] * (0.4 + vel));
            var gq = pt(gp);
            var op = p <= 0.001 || p >= 0.995 ? 0 : 0.42 * vel / (gi + 1);
            gsap.set(g, { x: gq.x, y: gq.y, scale: 1 - 0.72 * gp, opacity: op, rotation: -10 * Math.sin(Math.PI * gp) });
          });
          maskPath.style.strokeDashoffset = (ARC_LEN * (1 - Math.min(1, p + 0.04))) + "";
          if (p >= 0.995) { gsap.set(bubble, { opacity: 0 }); } else { gsap.set(bubble, { opacity: 1 }); }
        }
        tl.to(fly, { p: 1, duration: FLY_DUR, ease: "power3.out", onUpdate: apply }, FLY_AT);
        tl.fromTo("#h01-bubble-in", { scale: 0.93 }, { scale: 1.12, duration: 0.15, ease: "power2.out", immediateRender: false }, FLY_AT);
        tl.fromTo("#h01-phone-screen", { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: "power2.out", immediateRender: false }, FLY_AT);

        /* data packets stream along the arc */
        var pk = { t: 0 };
        function applyPackets() {
          var tt = pk.t;
          packets.forEach(function (el, i) {
            var f = (tt * 1.3 + i / packets.length) % 1;
            var q = pt(f);
            var fade = Math.min(1, f / 0.1) * Math.min(1, (1 - f) / 0.1);
            gsap.set(el, { x: q.x, y: q.y, opacity: 0.95 * fade, rotation: (f - 0.5) * 70 });
          });
        }
        tl.to(pk, { t: 1, duration: 1.66, ease: "none", onUpdate: applyPackets }, 2.18);

        /* ---------- Scene 3: landing (3.0 -> 3.84) ---------- */
        tl.fromTo("#h01-cloud", { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", immediateRender: false }, 2.98);
        tl.to("#h01-cloud", { scale: 1.0, duration: 0.5, ease: "power3.out" }, 3.1);
        tl.fromTo("#h01-ring", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.9, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.98);
        tl.fromTo("#h01-blob-mag", { opacity: 0.32 }, { opacity: 0.5, duration: 0.15, ease: "power2.out", immediateRender: false }, 2.98);
        tl.to("#h01-blob-mag", { opacity: 0.34, duration: 0.6, ease: "power2.out" }, 3.13);
        /* servers light up */
        leds.forEach(function (l, idx) {
          tl.set(l, { opacity: 1, fill: "#FF3DCB" }, 3.0 + idx * 0.06);
        });

        /* waterfall-entry labels: binary reveal, rise from below, shrinking gaps */
        var F = 1 / 60;
        var chipTimes = [3.0, 3.2, 3.4];
        var chipIds = ["#h01-chip1", "#h01-chip2", "#h01-chip3"];
        var chipY = [60, 52, 48];
        var chipDur = [0.2, 0.17, 0.16];
        chipIds.forEach(function (id, i) {
          tl.set(id, { opacity: 1, y: chipY[i], scale: 0.96 }, chipTimes[i]);
          tl.to(id, { y: 0, scale: 1, duration: chipDur[i], ease: "power4.out" }, chipTimes[i]);
        });
        /* final-beat life: last chip pulses glow, cloud breathes (settled hold) */
        tl.to("#h01-chip3", { boxShadow: "0 0 40px rgba(255,61,203,0.85)", duration: 0.3, ease: "sine.inOut" }, 3.5);
        tl.to("#h01-cloud", { scale: 1.015, duration: 0.3, ease: "sine.inOut" }, 3.6);

        window.__timelines["01-hook"] = tl;
      })();
    </script>
