        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // build reply words (3 lines)
        var lines = [

          ["headphones", "hum", "a", "quiet", "song,"],
          ["the", "city", "wakes", "slow."]
        ];
        var reply = document.getElementById("c07-reply");
        var words = [];
        lines.forEach(function (ln) {
          var d = document.createElement("div");
          d.className = "c07-line";
          ln.forEach(function (w, i) {
            var s = document.createElement("span");
            s.className = "c07-w";
            s.textContent = w + (i < ln.length - 1 ? " " : "");
            d.appendChild(s);
            words.push(s);
          });
          reply.appendChild(d);
        });

        // initial states (all via tl.set / fromTo so seeking is safe)
        gsap.set("#c07-user", { autoAlpha: 0 });
        gsap.set("#c07-think", { autoAlpha: 0 });
        gsap.set(words, { autoAlpha: 0 });
        gsap.set("#c07-gen", { autoAlpha: 0 });
        tl.set("#c07-caret", { autoAlpha: 1 }, 0);

        // background bloom drift
        tl.fromTo("#c07-b1", { x: 0, y: 0 }, { x: -60, y: 40, duration: 4.989, ease: "sine.inOut" }, 0);
        tl.fromTo("#c07-b2", { x: 0, y: 0 }, { x: 50, y: -30, duration: 4.989, ease: "sine.inOut" }, 0);

        // phone entrance + slow continuous push-in
        tl.fromTo("#c07-phone", { y: 50, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "expo.out" }, 0);
        tl.fromTo("#c07-cam", { scale: 1, transformOrigin: "1260px 700px" }, { scale: 1.035, duration: 4.989, ease: "sine.inOut" }, 0);

        // left copy on "Then just chat."
        tl.fromTo("#c07-kicker", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo("#c07-h1a", { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "expo.out" }, 0.45);
        tl.fromTo("#c07-h1b", { autoAlpha: 0, y: 50, scale: 0.9 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.64);

        // typing (discrete states, keystroke clusters)
        var prompt = "write a haiku about my commute";
        var sched = [];
        var t = 0.35;
        for (var i = 1; i <= prompt.length; i++) {
          sched.push({ t: t, n: i });
          t += (prompt[i - 1] === " ") ? 0.065 : 0.03;
        }
        var typedEl = document.getElementById("c07-typed");
        var phEl = document.getElementById("c07-ph");
        var proxy = { v: 0 };
        var endT = sched[sched.length - 1].t; // ~1.3s
        tl.fromTo(proxy, { v: 0 }, {
          v: 1, duration: endT - 0.35, ease: "none",
          onUpdate: function () {
            var now = tl.time();
            var n = 0;
            for (var k = sched.length - 1; k >= 0; k--) { if (now >= sched[k].t) { n = sched[k].n; break; } }
            typedEl.textContent = (now >= 1.38) ? "" : prompt.slice(0, n);
            phEl.style.opacity = (now >= 0.35 && now < 1.38) ? 0 : 1;
          }
        }, 0.35);
        // ensure clear + placeholder restored at exactly send time
        tl.call(function () { typedEl.textContent = ""; phEl.style.opacity = 1; }, null, 1.38);
        tl.set("#c07-caret", { autoAlpha: 0 }, 1.38);

        tl.to("#c07-send", { scale: 0.84, duration: 0.09, ease: "power2.in" }, 1.38);
        tl.to("#c07-send", { scale: 1, duration: 0.45, ease: "back.out(3)" }, 1.47);
        tl.to("#c07-send", { backgroundColor: "#1B1D22", boxShadow: "0 0 0px rgba(46,242,255,0)", duration: 0.4, ease: "power2.out" }, 1.7);
        tl.to("#c07-arrow", { stroke: "#A9ABB0", duration: 0.4 }, 1.7);

        // empty state vanishes, user bubble pops
        tl.to("#c07-empty", { autoAlpha: 0, y: -14, duration: 0.25, ease: "power2.in" }, 1.4);
        tl.fromTo("#c07-user", { autoAlpha: 0, scale: 0.7, x: 40, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, x: 0, duration: 0.45, ease: "back.out(1.8)" }, 1.52);

        // thinking shimmer (~0.3s) on "Replies" -> "stream"
        tl.fromTo("#c07-think", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.2, ease: "power3.out" }, 1.65);
        tl.fromTo("#c07-shim", { x: 0 }, { x: 240, duration: 0.4, ease: "power1.inOut" }, 1.7);
        tl.set("#c07-think", { autoAlpha: 0 }, 1.95);

        // reply streams word by word 1.95 -> ~3.75
        var step = 1.8 / words.length;
        words.forEach(function (w, i) {
          tl.fromTo(w, { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.18, ease: "power2.out" }, 1.95 + i * step);
        });

        // stats bars pulse during streaming (explicit finite pulses)
        for (var p = 0; p < 9; p++) {
          var base = 1.95 + p * 0.22;
          ["0", "1", "2"].forEach(function (idx, j) {
            tl.to("#c07-bars i:nth-child(" + (j + 1) + ")", { scaleY: (p % 2 === 0) ? 0.35 + 0.2 * j : 1 - 0.15 * j, duration: 0.2, ease: "sine.inOut" }, base + j * 0.03);
          });
        }
