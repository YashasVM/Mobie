        const tl = gsap.timeline({ paused: true });

        // seeded PRNG for deterministic particle scatter

        const URL_TXT = "github.com/YashasVM/Mobie";
        let html = '<span class="pr">› </span>';

        html += '<span class="n09-cur" id="n09-cur"></span>';
        urlEl.innerHTML = html;

        // particles
        const dotsEl = document.getElementById("n09-dots");
        const cols = ["#FFB547", "#FF3DCB", "#2EF2FF", "#FFB547", "#9BFF5A"];
        const N = 30;
        for (let i = 0; i < N; i++) {
          const d = document.createElement("div");
          d.className = "n09-dot";
          const s = 8 + Math.floor(rnd() * 12);
          d.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (960 - s / 2) + "px;top:" + (250 - s / 2) + "px;background:" + cols[i % cols.length] + ";box-shadow:0 0 16px " + cols[i % cols.length];
          dotsEl.appendChild(d);
          const ang = (i / N) * Math.PI * 2 + rnd() * 0.3;
          const dist = 260 + rnd() * 340;
          const t0 = 0.34 + rnd() * 0.06;
          tl.fromTo(d, { x: 0, y: 0, scale: 1, opacity: 0 }, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist * 0.7, opacity: 1, duration: 0.55, ease: "power3.out" }, t0);
          tl.to(d, { opacity: 0, scale: 0.2, duration: 0.5, ease: "power2.in" }, t0 + 0.5);
        }

        // slow background bloom drift (only thing that moves at the end)
        tl.fromTo("#n09-bloomA", { x: 0, y: 0 }, { x: 60, y: 30, duration: 7.3, ease: "sine.inOut" }, 0);
        tl.fromTo("#n09-bloomB", { x: 0, y: 0 }, { x: 70, y: -40, duration: 7.3, ease: "sine.inOut" }, 0);

        tl.fromTo("#n09-ring", { scale: 0.9, opacity: 0.95 }, { scale: 3.4, opacity: 0, duration: 0.8, ease: "power2.out" }, 0.34);
        tl.to("#n09-icon", { x: 0, duration: 0.65, ease: "power3.inOut" }, 0.78);
        tl.fromTo("#n09-wm", { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.65, ease: "power3.inOut" }, 0.78);

        tl.fromTo("#n09-t2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.9, ease: "power2.inOut", immediateRender: false }, 2.0);

        // Scene 3: button springs in on "Free" (2.94)

        // press-release on "Grab" (4.69)
        tl.to("#n09-btnwrap", { scale: 0.9, duration: 0.11, ease: "power1.in" }, 4.69);
        tl.to("#n09-btnwrap", { scale: 1, duration: 0.5, ease: "back.out(2.4)", overwrite: "auto" }, 4.81);
        tl.to("#n09-btn", { backgroundColor: "#FFB547", color: "#0C0C0B", boxShadow: "0 0 60px rgba(255,181,71,0.75), inset 0 0 0 rgba(255,181,71,0)", duration: 0.2, ease: "power2.out" }, 4.81);
