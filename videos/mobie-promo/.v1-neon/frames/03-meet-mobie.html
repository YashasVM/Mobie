    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var DUR = 4.232;
        var tl = gsap.timeline({ paused: true });
        window.__timelines["03-meet-mobie"] = tl;
        tl.to({}, { duration: DUR }, 0);

        // ---------- ASCII decode (pure function of time) ----------
        var LINES = [
          "███╗   ███╗ ██████╗ ██████╗ ██╗███████╗",
          "████╗ ████║██╔═══██╗██╔══██╗██║██╔════╝",
          "██╔████╔██║██║   ██║██████╔╝██║█████╗",
          "██║╚██╔╝██║██║   ██║██╔══██╗██║██╔══╝",
          "██║ ╚═╝ ██║╚██████╔╝██████╔╝██║███████╗",
          "╚═╝     ╚═╝ ╚═════╝ ╚═════╝ ╚═╝╚══════╝"
        ];
        var W = 0;
        LINES.forEach(function (l) { W = Math.max(W, l.length); });
        var GL = ["█", "╗", "═", "║", "╔", "╝", "╚", "╬", "╦", "╩", "╠", "╣"];
        var DEC_START = 0.0, DEC_END = 1.1, TAIL = 7;
        function glyph(seed) {
          var h = ((seed * 9301 + 49297) % 233280) / 233280;
          return GL[Math.floor(h * GL.length)];
        }
        function asciiAt(t) {
          var p = Math.min(1, Math.max(0, (t - DEC_START) / (DEC_END - DEC_START)));
          var q = Math.floor(t * 24);
          var out = [];
          for (var r = 0; r < LINES.length; r++) {
            var front = 4 + p * (W + TAIL + 4) - r * 1.2;
            var line = LINES[r], s = "";
            for (var c = 0; c < W; c++) {
              var ch = c < line.length ? line.charAt(c) : " ";
              if (ch === " ") { s += " "; continue; }
              if (c < front - TAIL) s += ch;
              else if (c < front) s += glyph(r * 131 + c * 17 + q * 7919);
              else s += " ";
            }
            out.push(s);
          }
          return out.join("\n");
        }
        var preMain = document.getElementById("m03-pre-main");
        var preM = document.getElementById("m03-pre-m");
        var preC = document.getElementById("m03-pre-c");
        var finalText = LINES.map(function (l) { while (l.length < W) l += " "; return l; }).join("\n");
        preM.textContent = finalText;
        preC.textContent = finalText;
        preMain.textContent = asciiAt(0);

        // ---------- tagline typing (discrete states) + caret ----------
        var WHOLE = "real ai models. on your phone.";
        var SPLIT = 16;
        var A_START = 1.72, A_STEP = 0.055, B_START = 3.3, B_STEP = 0.048;
        function countAt(t) {
          if (t < A_START) return 0;
          if (t < B_START) return Math.min(15, Math.floor((t - A_START) / A_STEP) + 1);
          var nb = Math.floor((t - B_START) / B_STEP) + 1;
          return Math.min(WHOLE.length, 15 + nb);
        }
        var elA = document.getElementById("m03-tag-a");
        var elB = document.getElementById("m03-tag-b");
        var caret = document.getElementById("m03-caret");
        var typeDone = B_START + B_STEP * 15;
        var drv = { t: 0 };
        tl.to(drv, {
          t: DUR, duration: DUR, ease: "none",
          onUpdate: function () {
            var t = drv.t;
            if (t < 1.16) preMain.textContent = asciiAt(t);
            else if (preMain.textContent !== finalText) preMain.textContent = finalText;
            var n = countAt(t);
            var txt = WHOLE.slice(0, n);
            elA.textContent = txt.slice(0, SPLIT);
            elB.textContent = txt.slice(SPLIT);
            var vis;
            if (t < 1.65) vis = 0;
            else if (t < typeDone) vis = 1;
            else vis = Math.sin((t - typeDone) * Math.PI * 2 / 0.64 + 1.2) > -0.2 ? 1 : 0;
            caret.style.opacity = vis ? "1" : "0";
          }
        }, 0);
        // make sure the t=0 state is deterministic before first seek
        caret.style.opacity = "0";

        // ---------- scene 1: flip-in nod + glow ----------
        tl.fromTo("#m03-ascii", { rotateX: 55, opacity: 0, transformOrigin: "50% 100%", y: 24 },
          { rotateX: 0, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);
        tl.fromTo("#m03-pre-main", { filter: "brightness(1.8)" },
          { filter: "brightness(1)", duration: 0.7, ease: "power2.out" }, 1.0);

        // RGB-split flicker on resolve (stepped sets, deterministic)
        var fl = [
          [1.10, 0.9, -9, 9, 3],
          [1.15, 0.0, 0, 0, 0],
          [1.19, 0.85, 7, -7, -2],
          [1.24, 0.0, 0, 0, 0],
          [1.28, 0.8, -5, 5, 1],
          [1.34, 0.55, 3, -3, 0],
          [1.40, 0.0, 0, 0, 0]
        ];
        fl.forEach(function (f) {
          tl.set("#m03-pre-m", { opacity: f[1], x: f[2], y: f[4] }, f[0]);
          tl.set("#m03-pre-c", { opacity: f[1], x: f[3], y: -f[4] }, f[0]);
          tl.set("#m03-pre-main", { x: f[1] > 0 ? f[2] * -0.3 : 0 }, f[0]);
        });

        // ---------- scene 2: scale-swap ascii -> lockup ----------
        tl.to("#m03-ascii", { scale: 0.72, opacity: 0, duration: 0.32, ease: "power2.in" }, 1.46);
        tl.fromTo("#m03-lock", { scale: 0.72, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 1.58);
        tl.fromTo("#m03-word", { x: -40 }, { x: 0, duration: 0.6, ease: "power3.out" }, 1.62);
        tl.fromTo("#m03-icon", { rotation: -8, boxShadow: "0 0 0 4px #FFB547, 0 0 110px 30px rgba(255,181,71,0.95), inset 0 0 40px rgba(255,181,71,0.18)" },
          { rotation: 0, boxShadow: "0 0 0 4px #FFB547, 0 0 46px 6px rgba(255,181,71,0.7), inset 0 0 40px rgba(255,181,71,0.18)", duration: 0.9, ease: "back.out(1.8)" }, 1.58);
        // slow settle push through the hold
        tl.fromTo("#m03-lock", { scale: 1 }, { scale: 1.035, duration: 2.0, ease: "none", immediateRender: false }, 2.2);

        // ---------- scene 3: tagline entrance + bloom drift ----------
        tl.fromTo("#m03-tag-wrap", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.62);

        tl.fromTo("#m03-blob-a", { x: -80, scale: 0.9 }, { x: 60, scale: 1.12, duration: DUR, ease: "sine.inOut" }, 0);
