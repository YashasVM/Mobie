<template id="01-hook-template">
  <div id="f01-root" data-composition-id="01-hook" data-start="0" data-duration="5.009" data-width="1920" data-height="1080">
    <style>
      @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("assets/fonts/plex_mono_regular.ttf") format("truetype"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/plex_mono_medium.ttf") format("truetype"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("assets/fonts/plex_mono_semibold.ttf") format("truetype"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 700; src: url("assets/fonts/plex_mono_bold.ttf") format("truetype"); }

      #f01-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "IBM Plex Mono", monospace; color: #D6D3C8; }
      #f01-root * { box-sizing: border-box; margin: 0; padding: 0; }
      .f01-layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .f01-ground { background: #0C0C0B; }
      .f01-scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0 1px, transparent 1px 3px); pointer-events: none; }

      /* tmux bar (grey variant) */
      .f01-bar { position: absolute; left: 0; top: 0; width: 1920px; height: 48px; background: #2A2925; color: #AAA79D; font-weight: 500; font-size: 22px; line-height: 48px; white-space: pre; }
      .f01-bar-l { position: absolute; left: 200px; top: 0; height: 48px; }
      .f01-bar-r { position: absolute; right: 200px; top: 0; height: 48px; }
      .f01-tab { display: inline-block; padding: 0 14px; height: 48px; }
      .f01-tab-on { background: #AAA79D; color: #0C0C0B; }

      /* terminal lines */
      .f01-line { position: absolute; left: 200px; white-space: pre; }
      .f01-cmd { top: 214px; font-size: 40px; line-height: 56px; font-weight: 400; }
      .f01-out { font-size: 34px; line-height: 46px; color: #AAA79D; display: none; }
      .f01-yel { font-size: 40px; line-height: 52px; color: #E8D27A; display: none; font-weight: 500; }
      .f01-big { font-size: 88px; line-height: 100px; font-weight: 600; letter-spacing: -0.01em; color: #D6D3C8; }
      .f01-amb { color: #FFB547; }
      .f01-yc { color: #E8D27A; }
      .f01-ch { display: none; }
      .f01-cur { display: inline-block; width: .6em; height: 1.1em; background: #FFB547; vertical-align: -.18em; opacity: 0; }
    </style>

    <div id="f01-layer-1" class="f01-layer f01-ground clip" data-start="0" data-duration="5.009" data-track-index="0"></div>

    <div id="f01-layer-2" class="f01-bar clip" data-start="0" data-duration="5.009" data-track-index="1">
      <div class="f01-bar-l"><span class="f01-tab f01-tab-on">0:cloud-chat</span></div>
      <div class="f01-bar-r"><span class="f01-tab">connected · us-east-1</span></div>
    </div>

    <div id="f01-layer-3" class="f01-layer clip" data-start="0" data-duration="5.009" data-track-index="2">
      <div class="f01-line f01-cmd" id="f01-cmd"><span class="f01-amb">$ </span><span id="f01-cmdtxt"></span><span class="f01-cur" id="f01-cur1"></span></div>

      <div class="f01-line f01-out" id="f01-o1" style="top:300px">| uploading prompt…</div>
      <div class="f01-line f01-out" id="f01-o2" style="top:346px">→ POST api.someone-elses-server.com/v1/chat</div>
      <div class="f01-line f01-out" id="f01-o3" style="top:392px">→ 200 OK</div>

      <div class="f01-line f01-yel" id="f01-y1" style="top:480px">logged.</div>
      <div class="f01-line f01-yel" id="f01-y2" style="top:532px">stored.</div>
      <div class="f01-line f01-yel" id="f01-y3" style="top:584px">used for training?</div>

      <div class="f01-line f01-big" id="f01-b1" style="top:660px"><span id="f01-b1txt"></span></div>
      <div class="f01-line f01-big" id="f01-b2" style="top:760px"><span id="f01-b2txt"></span><span class="f01-cur" id="f01-cur2"></span></div>
    </div>

    <div id="f01-layer-4" class="f01-layer f01-scan clip" data-start="0" data-duration="5.009" data-track-index="3"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var $ = function (id) { return document.getElementById(id); };

        // Build per-character spans (all hidden), reveal at exact times.
        function build(el, text, cls) {
          var spans = [];
          for (var i = 0; i < text.length; i++) {
            var s = document.createElement("span");
            s.className = "f01-ch" + (cls ? " " + cls : "");
            s.textContent = text.charAt(i);
            el.appendChild(s);
            spans.push(s);
          }
          return spans;
        }
        function type(spans, t0, t1) {
          var n = spans.length;
          for (var i = 0; i < n; i++) {
            tl.set(spans[i], { display: "inline" }, t0 + (n > 1 ? (t1 - t0) * i / (n - 1) : 0));
          }
        }
        function show(el, t) { tl.set(el, { display: "block" }, t); }

        // Scene 1: command types 0.3 -> 1.5, enter
        var cmd = build($("f01-cmdtxt"), 'ask "is this mole normal?"');
        type(cmd, 0.3, 1.5);
        var cur1 = $("f01-cur1");
        // cursor: blinking before typing, solid while typing, gone on enter
        tl.set(cur1, { opacity: 1 }, 0);
        tl.set(cur1, { opacity: 0 }, 0.15);
        tl.set(cur1, { opacity: 1 }, 0.3);
        tl.set(cur1, { opacity: 0 }, 1.6);

        // Scene 2: output lines 1.9 -> 2.9
        var o1 = $("f01-o1");
        show(o1, 1.9);
        var spin = ["|", "/", "-", "\\", "|"];
        var spinT = [1.9, 2.02, 2.14, 2.26, 2.38];
        for (var k = 0; k < spin.length; k++) {
          (function (ch, t) { tl.set(o1, { textContent: ch + " uploading prompt…" }, t); })(spin[k], spinT[k]);
        }
        // seek-safe: use set on a text-swap via discrete tweens instead of call
        show($("f01-o2"), 2.45);
        show($("f01-o3"), 2.72);

        // Scene 3: yellow snaps on "take a trip" (2.94)
        show($("f01-y1"), 2.94);
        show($("f01-y2"), 3.08);
        show($("f01-y3"), 3.22);

        // Big line, two rows, prints fast; "to the cloud." in yellow
        show($("f01-b1"), 2.475);
        show($("f01-b2"), 3.883);
        var b1 = build($("f01-b1txt"), "your words take a trip");
        var b2a = build($("f01-b2txt"), "to the cloud.", "f01-yc");
        // insert row-2 chars before the cursor
        var b2el = $("f01-b2txt");
        type(b1, 2.475, 3.754);
        type(b2a, 3.883, 4.487);
        var cur2 = $("f01-cur2");
        tl.set(cur2, { opacity: 1 }, 3.883);
        tl.set(cur2, { opacity: 0 }, 4.383);
        tl.set(cur2, { opacity: 1 }, 4.683);

        window.__timelines["01-hook"] = tl;
      })();
    </script>
  </div>
</template>
