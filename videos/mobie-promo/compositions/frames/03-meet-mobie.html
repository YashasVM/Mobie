    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Build per-character spans (hidden until cued) inside a container; returns span array.
        function chars(el, text, cls) {
          var out = [];
          for (var i = 0; i < text.length; i++) {
            var s = document.createElement("span");
            s.textContent = text.charAt(i);
            s.style.display = "none";
            if (cls) s.className = cls;
            el.appendChild(s);
            out.push(s);
          }
          return out;
        }
        // Reveal chars one by one from t0 across dur seconds.
        function type(list, t0, dur) {
          var n = list.length;
          for (var i = 0; i < n; i++) {
            tl.set(list[i], { display: "inline" }, t0 + (n > 1 ? (dur * i) / (n - 1) : 0));
          }
        }

        // Scene 1: boot lines
        var b0 = document.getElementById("f03-b0");
        var prompt = chars(b0, "$", "f03-a");
        var cmd = chars(b0, " mobie --version");
        type(prompt.concat(cmd), 0.02, 0.36);

        var b1 = document.getElementById("f03-b1");
        var l1 = chars(b1, "mobie 0.2.0 · android · litert-lm");
        type(l1, 0.42, 0.001);
        var b2 = document.getElementById("f03-b2");
        var c2 = chars(b2, "✓", "f03-g");
        var t2 = chars(b2, " runtime ready");
        type(c2.concat(t2), 0.54, 0.001);
        var b3 = document.getElementById("f03-b3");
        var c3 = chars(b3, "✓", "f03-g");
        var t3 = chars(b3, " network not required for chat");
        type(c3.concat(t3), 0.66, 0.001);

        // Scene 2: logo line wipes, on "Mobie." (0.51)
        var lns = document.querySelectorAll(".f03-ln");
        for (var i = 0; i < lns.length; i++) {
          tl.fromTo(lns[i], { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.26, ease: "steps(20)" }, 0.51 + i * 0.07);
        }

        // Scene 3: lead line, word-cued
        var cur = document.getElementById("f03-cur");
        var k1 = chars(document.getElementById("f03-l1"), "Run AI models");
        var k2 = chars(document.getElementById("f03-l2"), " on your phone,");
        var k3 = chars(document.getElementById("f03-l3"), " offline.");
        type(k1, 1.41, 0.7);   // "Real AI models"
        type(k2, 3.46, 0.5);   // "on your phone"
        type(k3, 3.98, 0.2);   // trailing beat

        // Block cursor: appears with the lead, blinks on/off every 0.5s (discrete)
        tl.set(cur, { display: "inline-block", opacity: 1 }, 1.41);
        var on = true;
        for (var t = 1.91; t < 4.232; t += 0.5) {
          on = !on;
          tl.set(cur, { opacity: on ? 1 : 0 }, t);
        }

        window.__timelines["03-meet-mobie"] = tl;
      })();
