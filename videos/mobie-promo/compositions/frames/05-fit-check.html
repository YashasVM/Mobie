  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const AMB = "#FFB547", BG = "#0C0C0B", FG = "#D6D3C8", GRN = "#8FD16A", YEL = "#E8D27A", RED = "#FF6B57", DIM = "#6F6C63";
    const $ = (id) => document.getElementById(id);

    // ---- big line, typed on the voice ----
    function typeInto(id, text, start, step) {
      const el = $(id);
      el.textContent = "";
      text.split("").forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "c";
        s.textContent = ch;
        s.style.whiteSpace = "pre";
        el.appendChild(s);
        tl.set(s, { display: "inline" }, start + i * step);
      });
    }
    typeInto("f05-t1", "mobie checks", 0.30, 0.045);   // "Mobie checks"
    typeInto("f05-t2", " first.", 1.96, 0.04);         // "first,"
    for (let k = 0; k < 10; k++) {
      tl.set("#f05-cur", { opacity: k % 2 === 0 ? 1 : 0 }, k * 0.5);
    }
    tl.set("#f05-cur", { opacity: 1 }, 0);

    // ---- helpers ----
    const flash = (id, t, d) => {
      tl.set(id, { backgroundColor: AMB, color: BG }, t);
      tl.set(id, { backgroundColor: "rgba(0,0,0,0)", color: DIM }, t + d);
    };
    const fillStr = (n) => "█".repeat(n);
    const restStr = (n) => "░".repeat(16 - n);
    const meter = (f, r, n, color, t) => {
      tl.set(f, { textContent: fillStr(n), color: color }, t);
      tl.set(r, { textContent: restStr(n) }, t);
    };
    const selectRow = (id, on, t, vdColor) => {
      const row = $(id);
      const kids = row.children;
      tl.set(row, { backgroundColor: on ? AMB : "rgba(0,0,0,0)", color: on ? BG : FG }, t);
      tl.set(kids[0], { textContent: on ? "›" : " " }, t);
      tl.set(kids[2], { color: on ? BG : vdColor }, t);
    };

    // ---- Scene 1: RAM / storage label flashes ----
    flash("#f05-lm", 1.07, 0.25);
    flash("#f05-ls", 1.58, 0.25);

    // initial selection on row 3
    selectRow("f05-r3", true, 0, GRN);

    // ---- Scene 2: row 4, tight ----
    const T2 = 2.60;
    selectRow("f05-r3", false, T2, GRN);
    selectRow("f05-r4", true, T2, YEL);
    tl.set("#f05-h", { textContent: "gemma-3n-E4B-it" }, T2);
    [[3, 0], [6, 0.06], [9, 0.12], [11, 0.18], [13, 0.24]].forEach(([n, dt]) => meter("#f05-mf", "#f05-mr", n, YEL, T2 + dt));
    meter("#f05-sf", "#f05-sr", 5, GRN, T2);
    tl.set("#f05-vd", { textContent: "! close some apps first", color: YEL, borderColor: YEL }, T2);

    // ---- Scene 3: row 5, too big ----
    const T3 = 4.01;
    selectRow("f05-r4", false, T3, YEL);
    selectRow("f05-r5", true, T3, RED);
    tl.set("#f05-h", { textContent: "large-model-example" }, T3);
    tl.set("#f05-q", { textContent: "int8" }, T3);
    tl.set("#f05-ty", { textContent: "text" }, T3);
    [[5, 0], [10, 0.06], [14, 0.12], [16, 0.18]].forEach(([n, dt]) => meter("#f05-mf", "#f05-mr", n, RED, T3 + dt));
    meter("#f05-sf", "#f05-sr", 8, GRN, T3);
    tl.set("#f05-mo", { textContent: " over" }, T3 + 0.18);
    tl.set("#f05-vd", { textContent: "x won't fit on this phone", color: RED, borderColor: RED }, T3);
    tl.set("#f05-vd", { backgroundColor: RED, color: BG }, 4.22);

    window.__timelines["05-fit-check"] = tl;
  </script>
